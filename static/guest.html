<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leave a message</title>
<link rel="icon" href="data:,">
<style>
  :root {
    color-scheme: dark;
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px;
    --r2: 8px; --r3: 12px;
    --bg: #0e0f11; --surface: #17181b; --surface-2: #1d1f23; --line: #2a2c31;
    --text: #ececee; --text-2: #a4a7ae; --text-3: #8f939a; --field-line: #70747c;
    --accent: #e9b949; --accent-ink: #1a1405; --accent-soft: rgba(233, 185, 73, 0.14);
    --ok: #4fbf7a; --danger: #ef6b5e;
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --bg: #f5f5f3; --surface: #ffffff; --surface-2: #f7f7f5; --line: #e4e4e0;
      --text: #18181b; --text-2: #54565d; --text-3: #686b72; --field-line: #7f838a;
      --accent: #8a6104; --accent-ink: #ffffff; --accent-soft: rgba(138, 97, 4, 0.1);
      --ok: #23804a; --danger: #c9392b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font: 16px/1.5 var(--font);
         display: flex; justify-content: center; padding: var(--s5) var(--s4); }
  main { width: 100%; max-width: 420px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 var(--s2); }
  p { margin: 0 0 var(--s4); color: var(--text-2); }
  form { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r3); padding: var(--s4); }
  label { display: block; font-size: 14px; font-weight: 500; margin: 0 0 6px; }
  input, textarea { width: 100%; font: inherit; color: var(--text); background: var(--surface-2); border: 1px solid var(--field-line);
                    border-radius: var(--r2); padding: 10px var(--s3); margin: 0 0 var(--s4); }
  textarea { min-height: 112px; resize: vertical; margin-bottom: 4px; }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .count { font-size: 13px; color: var(--text-3); text-align: right; margin-bottom: var(--s4); font-variant-numeric: tabular-nums; }
  button { width: 100%; min-height: 48px; font: inherit; font-weight: 600; border: 0; border-radius: var(--r2);
           background: var(--accent); color: var(--accent-ink); cursor: pointer; }
  button:disabled { opacity: 0.6; cursor: default; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .status { min-height: 24px; margin: var(--s3) 0 0; font-size: 15px; }
  .status.ok { color: var(--ok); }
  .status.error { color: var(--danger); }
  .doodle { display: flex; gap: var(--s3); align-items: flex-start; margin: 0 0 var(--s4); }
  #pad { width: 168px; height: 168px; flex: none; background: #050506; border: 1px solid var(--field-line); border-radius: var(--r2);
         touch-action: none; cursor: crosshair; }
  .doodle .side { display: flex; flex-direction: column; gap: var(--s2); font-size: 13px; color: var(--text-3); }
  .doodle .side button { width: auto; min-height: 40px; padding: 0 var(--s3); background: var(--surface-2); color: var(--text);
                         border: 1px solid var(--field-line); font-weight: 500; }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
</style>
</head>
<body>
<main>
  <h1>Leave a message</h1>
  <p>Write something for the board. It may need approving before it shows up.</p>
  <form id="f" method="post" action="/api/guest/submit">
    <label for="name">Your name (optional)</label>
    <input id="name" name="name" type="text" maxlength="24" autocomplete="given-name">
    <label for="message">Message</label>
    <textarea id="message" name="message" maxlength="140"></textarea>
    <div class="count" id="count">0 / 140</div>
    <label for="pad">Doodle (optional)</label>
    <div class="doodle">
      <canvas id="pad" width="168" height="168" aria-label="Doodle: draw with your finger, 21 by 21 dots"></canvas>
      <div class="side">
        <span>Draw with your finger. It shows next to your name on the board.</span>
        <button type="button" id="erase" aria-pressed="false">Eraser</button>
        <button type="button" id="clear">Clear</button>
      </div>
    </div>
    <div class="hp" aria-hidden="true"><label for="website">Leave this empty</label><input id="website" name="website" tabindex="-1" autocomplete="off"></div>
    <button id="send" type="submit">Send</button>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </form>
</main>
<script>
  const $ = id => document.getElementById(id);
  const msg = $("message"), status = $("status");
  const show = (text, ok) => { status.textContent = text; status.className = "status " + (ok ? "ok" : "error"); };
  const count = () => { $("count").textContent = `${msg.value.length} / 140`; };
  msg.addEventListener("input", count);
  // the doodle: 21 x 21 dots, drawn like the board shows them
  const N = 21, pad = $("pad"), pctx = pad.getContext("2d"), dots = new Uint8Array(N * N);
  let erase = false, drawing = false;
  const paint = () => {
    const c = pad.width / N;
    pctx.fillStyle = "#050506"; pctx.fillRect(0, 0, pad.width, pad.height);
    for (let i = 0; i < N * N; i++) {
      pctx.fillStyle = dots[i] ? "#f4f4f0" : "#1c1d20";
      pctx.beginPath(); pctx.arc((i % N + 0.5) * c, (Math.floor(i / N) + 0.5) * c, c * 0.42, 0, 2 * Math.PI); pctx.fill();
    }
  };
  const at = e => {
    const r = pad.getBoundingClientRect();
    const x = Math.floor((e.clientX - r.left) / r.width * N), y = Math.floor((e.clientY - r.top) / r.height * N);
    if (x >= 0 && y >= 0 && x < N && y < N) { dots[y * N + x] = erase ? 0 : 1; paint(); }
  };
  pad.addEventListener("pointerdown", e => { drawing = true; try { pad.setPointerCapture(e.pointerId); } catch {} at(e); });
  pad.addEventListener("pointermove", e => { if (drawing) at(e); });
  pad.addEventListener("pointerup", () => { drawing = false; });
  $("erase").onclick = () => { erase = !erase; $("erase").setAttribute("aria-pressed", String(erase)); $("erase").textContent = erase ? "Pen" : "Eraser"; };
  $("clear").onclick = () => { dots.fill(0); paint(); };
  paint();
  const doodle = () => dots.some(Boolean) ? Array.from({ length: N }, (_, y) => Array.from(dots.slice(y * N, y * N + N)).join("")) : null;
  const q = new URLSearchParams(location.search);
  if (q.has("sent")) show("Thanks! Your message is on its way to the board.", true);
  else if (q.get("error")) show(q.get("error"), false);
  $("f").addEventListener("submit", async e => {
    e.preventDefault();
    if (!msg.value.trim() && !doodle()) return show("Write a message or draw something first.", false);
    $("send").disabled = true;
    try {
      const r = await fetch("/api/guest/submit", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: $("name").value, message: msg.value, doodle: doodle(), website: $("website").value }),
      });
      const j = await r.json().catch(() => ({ error: `Something went wrong (${r.status}).` }));
      if (!r.ok) throw new Error(j.error || `Something went wrong (${r.status}).`);
      msg.value = ""; count(); dots.fill(0); paint();
      show(j.status === "approved" ? "Thanks! Your message will show on the board shortly." : "Thanks! Your message will show once it's approved.", true);
    } catch (err) {
      show(err.message === "Failed to fetch" ? "Couldn't reach the board. Check you're on the same Wi-Fi." : err.message, false);
    } finally {
      $("send").disabled = false;
    }
  });
</script>
</body>
</html>
