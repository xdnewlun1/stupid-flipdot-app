<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="dark light">
<title>Game controller</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/party.css">
<script>try { const t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}</script>
<style>
  /* phone game pad: same tokens and controls as the main app, big thumb targets, no text selection while mashing buttons */
  * { -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overscroll-behavior: none; }
  body { display: flex; flex-direction: column; gap: var(--s3); max-width: 560px; margin: 0 auto;
         padding: var(--s3) var(--s4) calc(var(--s4) + env(safe-area-inset-bottom)); user-select: none; -webkit-user-select: none; }
  .head { display: flex; align-items: center; gap: var(--s3); }
  .head h1 { font-size: var(--fs-lg); font-weight: 600; flex: 1; }
  .head a { font-size: var(--fs-sm); color: var(--text-2); }
  .pick { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; }
  .pick .group button { min-height: 40px; touch-action: manipulation; }
  .group button.active { background: var(--surface); }
  .gamePick { flex: 1; min-width: 180px; }
  .gamePick select { width: 100%; min-height: 40px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  #status { color: var(--text-2); font-size: var(--fs-sm); min-height: 20px; text-align: center; margin: 0; }
  .pad { flex: 1; display: flex; align-items: center; justify-content: space-between; gap: var(--s4); min-height: 228px; }
  .dpad { display: grid; grid-template-columns: repeat(3, 72px); grid-template-rows: repeat(3, 72px); gap: var(--s2); }
  .pad button { height: auto; padding: 0; touch-action: none; background: var(--surface-2); border-color: var(--line-strong); border-radius: var(--r3); }
  .pad .i { width: 28px; height: 28px; stroke-width: 2.25; }
  .pad button:active, .pad button.down { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .ab { display: flex; flex-direction: column; gap: var(--s4); align-items: center; }
  .ab button { width: 84px; height: 84px; border-radius: 50%; flex-direction: column; gap: 2px; font: 700 22px/1 var(--font); }
  .extra { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s2); }
  .extra[hidden] { display: none; }
  .extra button { min-height: 48px; padding: 0 var(--s2); touch-action: none; background: var(--surface-2); border-color: var(--line-strong); }
  .extra button:active, .extra button.down, .extra button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .ab small { font: 500 var(--fs-xs)/1 var(--font); color: inherit; opacity: 0.8; min-height: 12px; }
  .pick .group button { min-height: 44px; }
  .head a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 var(--s2); }
  #padHint { margin: 0; text-align: center; color: var(--text-2); font-size: var(--fs-xs); }
  .screen { display: flex; flex-direction: column; gap: var(--s2); min-width: 0; }
  /* phone held sideways: D-pad left, board in the middle, A/B right, all on one screen */
  @media (orientation: landscape) and (max-height: 500px) {
    body { max-width: none; height: 100dvh; padding: max(var(--s2), env(safe-area-inset-top)) max(var(--s4), env(safe-area-inset-right))
           max(var(--s2), env(safe-area-inset-bottom)) max(var(--s4), env(safe-area-inset-left));
           display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-rows: auto minmax(0, 1fr) auto; gap: var(--s2) var(--s4); }
    .head { display: contents; }
    .head h1 { display: none; }
    .head a { grid-column: 3; grid-row: 1; justify-self: end; min-height: 40px; }
    .pick { grid-column: 2; grid-row: 1; flex-wrap: nowrap; }
    .pick .group button { min-height: 40px; }
    .pad { display: contents; }
    .dpad { grid-column: 1; grid-row: 1 / 4; align-self: center; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(3, 64px); }
    .ab { grid-column: 3; grid-row: 2 / 4; align-self: center; flex-direction: row-reverse; align-items: flex-end; gap: var(--s3); }
    .ab button { width: 76px; height: 76px; }
    .ab button[data-key=b] { margin-bottom: 40px; }
    .screen { grid-column: 2; grid-row: 2; min-height: 0; justify-content: center; }
    .screen .wrap { min-height: 0; flex: 0 1 auto; padding: 4px; }
    .screen canvas { width: auto; max-width: 100%; max-height: calc(100dvh - 150px); margin: 0 auto; }
    .extras { grid-column: 2; grid-row: 3; }
    .extra { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .extra button { min-height: 40px; }
  }
  /* Watch mode: the board as big as the phone allows over the pad, for playing from the couch without seeing the board */
  body.watch .pick, body.watch #padHint, body.watch .head h1 { display: none; }
  body.watch { max-width: none; }
  body.watch .screen .wrap { padding: 2px; }
  body.watch .screen canvas { width: 100%; height: auto; }
  #watchBtn { min-height: 44px; }
  @media (max-width: 360px) { .dpad { grid-template-columns: repeat(3, 60px); grid-template-rows: repeat(3, 60px); } .ab button { width: 72px; height: 72px; } }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-up" viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
  </svg>
  <header class="head">
    <h1>Game controller</h1>
    <button type="button" id="watchBtn" aria-pressed="false" title="Show the board as big as possible above the buttons">Watch</button>
    <a href="/" id="backLink">Back to the board</a>
  </header>
  <div class="pick">
    <label class="gamePick"><span class="sr">Game</span>
      <select id="gamePick" aria-label="Game"><option value="">Pick a game…</option></select>
    </label>
    <div class="group" role="group" aria-label="Player">
      <button data-player="1" class="active" aria-pressed="true" aria-label="Player 1">P1</button>
      <button data-player="2" aria-pressed="false" aria-label="Player 2">P2</button>
      <button data-player="3" aria-pressed="false" aria-label="Player 3">P3</button>
      <button data-player="4" aria-pressed="false" aria-label="Player 4">P4</button>
    </div>
    <button type="button" id="boardMenu" title="Open the game menu on the board; pick with the arrows and A">Menu on board</button>
  </div>
  <div class="screen">
  <div class="wrap"><canvas id="board" aria-label="The board"></canvas></div>
  <p id="status" role="status" aria-live="polite">Connecting…</p>
  <p id="padHint" hidden>Game menu: hold Start on a controller to switch games.</p>
  </div>
  <section class="party" id="party" hidden aria-label="Party game"></section>
  <div class="pad">
    <div class="dpad">
      <span></span><button data-key="up" aria-label="Up"><svg class="i" aria-hidden="true"><use href="#i-up"/></svg></button><span></span>
      <button data-key="left" aria-label="Left"><svg class="i" aria-hidden="true"><use href="#i-left"/></svg></button><span></span><button data-key="right" aria-label="Right"><svg class="i" aria-hidden="true"><use href="#i-right"/></svg></button>
      <span></span><button data-key="down" aria-label="Down"><svg class="i" aria-hidden="true"><use href="#i-down"/></svg></button><span></span>
    </div>
    <div class="ab">
      <button data-key="a">A<small id="hintA"></small></button>
      <button data-key="b">B<small id="hintB"></small></button>
    </div>
  </div>
  <div class="extras">
  <div class="extra" id="gameKeys" role="group" aria-label="More buttons" hidden>
    <button data-key="start">Start</button>
    <button data-key="x">X</button>
    <button data-key="y">Y</button>
    <button data-key="z">Z</button>
  </div>
  <div class="extra" id="doomKeys" role="group" aria-label="Doom" hidden>
    <button data-key="strafe_left">Strafe left</button>
    <button data-key="strafe_right">Strafe right</button>
    <button data-key="weapon">Next weapon</button>
    <button data-key="run" id="runKey" aria-pressed="false">Run</button>
  </div>
  <div class="extra" id="nesKeys" role="group" aria-label="NES" hidden>
    <button data-key="select">Select</button>
    <button data-key="start">Start</button>
    <button data-key="save" title="Save the game here (one save per game)">Save</button>
    <button data-key="load" title="Go back to the saved game">Load</button>
  </div>
  </div>
<script type="module">
import { GAME_GROUPS as GAMES } from "/static/js/games.js";
import { partyMode } from "/static/js/partyplay.js";
const canvas = document.getElementById("board"), ctx = canvas.getContext("2d");
let player = 1, runner = null;
const runKey = document.getElementById("runKey");
const toggleRun = () => runKey.setAttribute("aria-pressed", String(runKey.getAttribute("aria-pressed") !== "true"));

const statusEl = document.getElementById("status");
let ws = null, wsOpen = false, retry = 500;

function drawBits(W, H, isOn) {
  const cell = 6;
  if (canvas.width !== W * cell) { canvas.width = W * cell; canvas.height = H * cell; }
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#f4f4f0";
  for (let y = 0, i = 0; y < H; y++) for (let x = 0; x < W; x++, i++) if (isOn(x, y, i)) ctx.fillRect(x * cell + 1, y * cell + 1, cell - 2, cell - 2);
}

// the picker: [id, name], grouped as on the Apps page
const gamePick = document.getElementById("gamePick");
for (const [group, games] of Object.entries(GAMES)) {
  const og = document.createElement("optgroup");
  og.label = group;
  for (const [id, name] of games) og.append(new Option(name, id));
  gamePick.append(og);
}
const HINTS = { tetris: ["rotate", "drop"], blackjack: ["deal / hit", "stand"], snake: ["", ""], pong: ["", ""],
  breakout: ["launch", "launch"], invaders: ["fire", "fire"], tron: ["", ""], flappy: ["flap", "flap"], platformer: ["jump", "run"], doom: ["fire", "use"], nes: ["", ""],
  asteroids: ["fire", "hyperspace"], galaxian: ["fire", "fire"], missile_command: ["fire", "fire"], centipede: ["fire", "fire"], lunar_lander: ["thrust", ""],
  pacman: ["", ""], frogger: ["", ""], qix: ["draw", "slow draw"], bomberman: ["bomb", "bomb"], tanks: ["fire", "fire"],
  dino: ["jump", "jump"], racer: ["gas", "brake"], copter: ["climb", ""], stacker: ["stop / go on", "take prize"], skyjump: ["", ""], pitfall: ["jump / let go", ""],
  connect4: ["drop", "drop"], tictactoe: ["place", "place"], artillery: ["fire", ""], checkers: ["select / move", "cancel"],
  battleship: ["fire / place", "rotate"], quickdraw: ["draw", "draw"], air_hockey: ["", ""],
  game2048: ["keep going", "new game"], minesweeper: ["open / chord", "flag"], sokoban: ["restart (×2)", "undo"], lights_out: ["toggle", "undo"],
  simon: ["", ""], columns: ["cycle", "drop"], mastermind: ["check", "clear slot"],
  party: ["join / mash", "leave"], quiz: ["join / buzz", "buzz"], pictionary: ["join", ""], rhythm: ["hit", "hit"], drummachine: ["play / stop", "stop"] };
function showStatus() {
  if (!runner) return;
  const game = runner.interactive ? (runner.description || "").toLowerCase() : "";
  const key = runner.interactive && HINTS[runner.app] ? runner.app : Object.keys(HINTS).find(k => game.includes(k));
  const [ha, hb] = HINTS[key] || ["", ""];
  document.getElementById("hintA").textContent = ha;
  document.getElementById("hintB").textContent = hb;
  // Doom-only buttons; "Run" is a toggle in the game, so it resets whenever Doom isn't running
  const doom = !!runner.interactive && runner.app === "doom";
  document.getElementById("doomKeys").hidden = !doom;
  const nes = !!runner.interactive && runner.app === "nes";
  document.getElementById("nesKeys").hidden = !nes;
  document.getElementById("gameKeys").hidden = !runner.interactive || doom || nes;
  if (!doom) runKey.setAttribute("aria-pressed", "false");
  statusEl.textContent = (runner.interactive ? runner.description : "No game running. Pick one above.") + (wsOpen ? "" : " (reconnecting…)");
  if (document.activeElement !== gamePick) gamePick.value = runner.interactive && HINTS[runner.app] ? runner.app : "";
  partyMode(runner, player, wsParty);  // the party games' own controls (static/js/partyplay.js)
}

// Live updates over a WebSocket; plain polling while it's down.
function connect() {
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws" + location.search);
  ws.binaryType = "arraybuffer";
  ws.onopen = () => { wsOpen = true; retry = 500; showStatus(); };
  ws.onmessage = e => {
    if (typeof e.data === "string") {
      const m = JSON.parse(e.data);
      if (m.type === "status") { runner = m.runner; showStatus(); }
      return;
    }
    const dv = new DataView(e.data), W = dv.getUint16(4), H = dv.getUint16(6), bits = new Uint8Array(e.data, 8);
    drawBits(W, H, (x, y, i) => bits[i >> 3] & (0x80 >> (i & 7)));
  };
  ws.onclose = () => { wsOpen = false; showStatus(); setTimeout(connect, retry); retry = Math.min(retry * 2, 5000); };
}
connect();

let failures = 0;
async function poll() {
  if (!wsOpen) {
    try {
      const s = await (await fetch("/api/board", { cache: "no-store" })).json();
      runner = s.runner; failures = 0;
      drawBits(s.width, s.height, (x, y) => s.rows[y][x] === "1");
      showStatus();
    } catch { if (++failures >= 3) statusEl.textContent = "Can't reach the board. Retrying…"; }
  }
  setTimeout(poll, wsOpen ? 1000 : 400);
}
poll();

const wsParty = msg => { if (!wsOpen) return false; ws.send(JSON.stringify(msg)); return true; };
const send = (key, action) => {
  const msg = { key, action, player };
  if (wsOpen) ws.send(JSON.stringify({ type: "input", ...msg }));
  else fetch("/api/input", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(msg) });
};

document.querySelectorAll("[data-key]").forEach(b => {
  const key = b.dataset.key;
  b.addEventListener("pointerdown", e => { e.preventDefault(); if (key === "run") toggleRun(); b.setPointerCapture(e.pointerId); b.classList.add("down"); send(key, "down"); navigator.vibrate?.(10); });
  const up = () => { if (b.classList.contains("down")) { b.classList.remove("down"); send(key, "up"); } };
  b.addEventListener("pointerup", up);
  b.addEventListener("pointercancel", up);
  b.addEventListener("contextmenu", e => e.preventDefault());
});
// gamepads plugged into the server can open the game menu on the board, unless that's turned off
fetch("/api/settings").then(r => r.json()).then(s => {
  document.getElementById("padHint").hidden = s.gamepad?.enabled === false || s.gamepad?.menu_button === "off";
}).catch(() => {});

// a player link (Settings, People & access) can't open the main app: no link back to it
fetch("/api/me").then(r => r.json()).then(me => { if (me.role && me.role !== "owner") document.getElementById("backLink").hidden = true; }).catch(() => {});
document.getElementById("boardMenu").onclick = async () => {
  try {
    const r = await fetch("/api/play/menu", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ player }) });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || `error ${r.status}`);
  } catch (e) { statusEl.textContent = `Couldn't open the menu: ${e.message}`; }
};

gamePick.onchange = async () => {
  const id = gamePick.value;
  if (!id) return;
  try {
    const r = await fetch("/api/run", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ app: id }) });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || `error ${r.status}`);
  } catch (e) { statusEl.textContent = `Couldn't start ${gamePick.selectedOptions[0].text}: ${e.message}`; }
  gamePick.blur();
};
const pickPlayer = b => {
  player = +b.dataset.player;
  document.querySelectorAll("[data-player]").forEach(x => { x.classList.toggle("active", x === b); x.setAttribute("aria-pressed", String(x === b)); });
};
document.querySelectorAll("[data-player]").forEach(b => b.onclick = () => {
  pickPlayer(b);
  try { localStorage.setItem("playPlayer", b.dataset.player); } catch {}
  if (runner) showStatus();
});
try { const saved = document.querySelector(`[data-player="${localStorage.getItem("playPlayer")}"]`); if (saved) pickPlayer(saved); } catch {}

// Watch mode (also /play?watch=1): full screen, the picker hidden, the board as big as it fits
const watchBtn = document.getElementById("watchBtn");
const setWatch = on => {
  document.body.classList.toggle("watch", on);
  watchBtn.setAttribute("aria-pressed", String(on));
  watchBtn.textContent = on ? "Controls" : "Watch";
  try {
    if (on && !document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {});
    if (!on && document.fullscreenElement) document.exitFullscreen?.().catch(() => {});
  } catch {}
};
watchBtn.onclick = () => setWatch(!document.body.classList.contains("watch"));
if (new URLSearchParams(location.search).has("watch")) setWatch(true);

const KEYS = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right", w: "up", s: "down", a: "left", d: "right", " ": "a", Enter: "b",
  q: "strafe_left", e: "strafe_right", r: "weapon", Shift: "run" };
addEventListener("keydown", e => { const k = KEYS[e.key]; if (k && !e.repeat) { e.preventDefault(); if (k === "run") toggleRun(); send(k, "down"); } });
addEventListener("keyup", e => { const k = KEYS[e.key]; if (k) send(k, "up"); });
</script>
</body>
</html>
